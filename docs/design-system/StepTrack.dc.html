<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:grid;grid-template-columns:repeat({{ n }},minmax(0,1fr));border:3px solid #1c1a17;font-family:'Archivo',sans-serif;font-size:12px;font-weight:800;letter-spacing:.1em;text-align:center">
  <sc-for list="{{ steps }}" as="s" hint-placeholder-count="3">
    <div style="padding:8px 4px;background:{{ s.bg }};color:{{ s.fg }};border-left:{{ s.edge }};transition:background-color 83ms steps(1,end)">{{ s.label }}</div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:40},&quot;steps&quot;:{&quot;editor&quot;:null,&quot;default&quot;:[&quot;HULL&quot;,&quot;DESTINATION&quot;,&quot;CONFIRM&quot;],&quot;tsType&quot;:&quot;string[]&quot;},&quot;current&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;min&quot;:0,&quot;max&quot;:2,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const names = this.props.steps ?? ['HULL', 'DESTINATION', 'CONFIRM'];
    const cur = this.props.current ?? 0;
    return {
      n: names.length,
      steps: names.map((s, i) => ({
        label: `${i + 1} · ${s}`, edge: i ? '2px solid #1c1a17' : 'none',
        bg: i === cur ? '#c99a2e' : (i < cur ? '#1c1a17' : '#2c353b'),
        fg: i === cur ? '#1c1a17' : (i < cur ? '#e6dcc3' : '#b8ad94')
      }))
    };
  }
}
</script>
</body>
</html>
