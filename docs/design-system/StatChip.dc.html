<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>@keyframes ag-flash{0%,49%{background-color:#a8431f}50%,100%{background-color:#7a2e14}}</style></helmet>
<div style="display:flex;flex-direction:column;justify-content:center;padding:0 {{ padX }};height:100%;box-sizing:border-box;font-family:'Archivo',sans-serif;font-variant-numeric:tabular-nums;color:#e6dcc3;background:{{ bg }};border-left:{{ edge }} solid #1c1a17;animation:{{ anim }}">
  <span style="font-size:12px;font-weight:700;letter-spacing:.12em;color:{{ labelC }};white-space:nowrap">{{ label }}</span>
  <span style="font-size:20px;font-weight:800;font-stretch:85%;white-space:nowrap">{{ value }}</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:200,&quot;height&quot;:64},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;CREDITS&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;value&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;5,000&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;plain&quot;,&quot;alert&quot;,&quot;critical&quot;],&quot;default&quot;:&quot;plain&quot;,&quot;tsType&quot;:&quot;'plain'|'alert'|'critical'&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const tone = this.props.tone ?? 'plain';
    const alert = tone === 'alert' || tone === 'critical';
    return {
      label: this.props.label ?? 'CREDITS', value: this.props.value ?? '5,000',
      bg: alert ? 'linear-gradient(135deg,#a8431f 0 82%,#7a2e14 82% 100%)' : 'transparent',
      labelC: alert ? '#e6dcc3' : '#b8ad94', edge: alert ? '3px' : '2px', padX: alert ? '20px' : '16px',
      anim: tone === 'critical' ? 'ag-flash 1s steps(1,end) infinite' : 'none'
    };
  }
}
</script>
</body>
</html>
