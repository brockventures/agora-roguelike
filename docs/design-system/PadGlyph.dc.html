<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:inline-flex;align-items:center;gap:6px;font-family:'Archivo',sans-serif;font-size:14px;font-weight:600;color:{{ labelColor }};white-space:nowrap">
  <div style="width:22px;height:22px;border-radius:50%;background:{{ discBg }};border:2px solid #1c1a17;color:{{ discFg }};font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;box-sizing:border-box;flex:none">{{ button }}</div>
  <sc-if value="{{ hasLabel }}" hint-placeholder-val="{{ true }}"><span>{{ label }}</span></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:160,&quot;height&quot;:40},&quot;button&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;A&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Submit&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;surface&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;plate&quot;,&quot;paper&quot;],&quot;default&quot;:&quot;plate&quot;,&quot;tsType&quot;:&quot;'plate'|'paper'&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const onPaper = (this.props.surface ?? 'plate') === 'paper';
    return {
      button: this.props.button ?? 'A', label: this.props.label ?? '', hasLabel: !!this.props.label,
      discBg: onPaper ? '#1c1a17' : '#e6dcc3', discFg: onPaper ? '#e6dcc3' : '#1c1a17',
      labelColor: onPaper ? '#1c1a17' : '#e6dcc3'
    };
  }
}
</script>
</body>
</html>
