<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div onClick="{{ onClick }}" style="display:grid;grid-template-columns:16px minmax(0,1fr) 56px 56px 56px;gap:8px;align-items:center;padding:8px;cursor:pointer;font-family:'Archivo',sans-serif;font-variant-numeric:tabular-nums;color:#1c1a17;background:{{ bg }};border:3px solid {{ bd }};box-shadow:{{ sh }};transition:background-color 83ms steps(1,end),box-shadow 83ms steps(1,end)">
  <span style="font-size:14px;font-weight:800">{{ marker }}</span>
  <span style="display:flex;flex-direction:column;align-items:flex-start;gap:2px;font-size:17px;font-weight:800;font-stretch:80%;min-width:0;overflow-wrap:anywhere">{{ commodity }}<sc-if value="{{ hasTag }}" hint-placeholder-val="{{ false }}"><span style="background:#a8431f;color:#e6dcc3;border:2px solid #1c1a17;font-size:12px;font-weight:800;letter-spacing:.08em;padding:0 5px;font-stretch:100%">{{ tag }}</span></sc-if></span>
  <span style="text-align:right;font-size:17px;font-weight:700">{{ bid }}</span>
  <span style="text-align:right;font-size:17px;font-weight:700">{{ ask }}</span>
  <span style="text-align:right;font-size:14px;font-weight:700;color:{{ chgC }}">{{ change }}</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:384,&quot;height&quot;:60},&quot;commodity&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;ORE&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;bid&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;16.0&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;ask&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;18.0&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;change&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;+5.9%&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tag&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;focused&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onSelect&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const f = !!this.props.focused;
    const chg = this.props.change ?? '+5.9%';
    return {
      commodity: this.props.commodity ?? 'ORE', bid: this.props.bid ?? '16.0', ask: this.props.ask ?? '18.0', change: chg,
      tag: this.props.tag ?? '', hasTag: !!this.props.tag, marker: f ? '▸' : '',
      chgC: String(chg).startsWith('+') ? '#1f4f4b' : '#7a2e14',
      bg: f ? '#c99a2e' : 'transparent', bd: f ? '#1c1a17' : 'transparent', sh: f ? '4px 4px 0 #1c1a17' : 'none',
      onClick: () => this.props.onSelect && this.props.onSelect()
    };
  }
}
</script>
</body>
</html>
